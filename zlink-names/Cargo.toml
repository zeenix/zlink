[package]
name = "zlink-names"
version = "0.7.1"
description = "Varlink names and their validation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
winnow = { version = "0.7", default-features = false }

# The name types need `CheapStr::as_str` to be a `const fn`, which no zcheapstr release has yet.
[dependencies.zcheapstr]
git = "https://github.com/z-galaxy/zcheapstr"
rev = "9fd99aca4b3676d79e34f46020d89e25b1f23c32"
default-features = false

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]
